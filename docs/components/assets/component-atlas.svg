<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">AI Architect component responsibility map</title>
  <desc id="desc">A layered architecture showing client input, FastAPI controls, the parent LangGraph core, a remote local RAG subgraph, Ollama, audit storage, and the local-only routing boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31465b"/></marker>
    <style>
      .zone{stroke-width:2;rx:18}.box{stroke:#31465b;stroke-width:2;rx:12}.arrow{stroke:#31465b;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font:700 25px Arial,sans-serif;fill:#11283b}.heading{font:700 17px Arial,sans-serif;fill:#11283b}.label{font:15px Arial,sans-serif;fill:#173246}.small{font:13px Arial,sans-serif;fill:#28475e}.note{font:13px Arial,sans-serif;fill:#5c3d00}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f7fafc"/>
  <text x="55" y="52" class="title">Governed local decision-support pattern — component responsibilities</text>
  <text x="55" y="80" class="small">Only the sanitized case may enter graph state, retrieval, Ollama, routing, and the audit ledger.</text>

  <rect x="45" y="115" width="220" height="610" class="zone" fill="#e8f2fb" stroke="#4f83ad"/>
  <text x="65" y="150" class="heading">Untrusted client zone</text>
  <rect x="70" y="185" width="170" height="115" class="box" fill="#ffffff"/>
  <text x="90" y="220" class="heading">Caller</text>
  <text x="90" y="248" class="label">Case submission</text>
  <text x="90" y="271" class="label">Local headers / OIDC</text>
  <rect x="70" y="410" width="170" height="115" class="box" fill="#fff6e8"/>
  <text x="90" y="445" class="heading">Reviewer</text>
  <text x="90" y="473" class="label">Approve / reject /</text>
  <text x="90" y="496" class="label">escalate + rationale</text>

  <rect x="300" y="115" width="325" height="610" class="zone" fill="#edf7ee" stroke="#509167"/>
  <text x="320" y="150" class="heading">FastAPI boundary — `api.py`</text>
  <rect x="330" y="185" width="265" height="105" class="box" fill="#ffffff"/>
  <text x="350" y="220" class="heading">Pydantic HTTP contracts</text>
  <text x="350" y="247" class="label">`models.py` validates shape</text>
  <text x="350" y="270" class="label">and field limits</text>
  <rect x="330" y="330" width="265" height="120" class="box" fill="#ffffff"/>
  <text x="350" y="365" class="heading">Identity + authorization</text>
  <text x="350" y="392" class="label">`auth.py` resolves principal</text>
  <text x="350" y="415" class="label">and checks tenant/roles</text>
  <rect x="330" y="490" width="265" height="135" class="box" fill="#ffffff"/>
  <text x="350" y="525" class="heading">Policy / PII gate</text>
  <text x="350" y="552" class="label">`policy.py` redacts known</text>
  <text x="350" y="575" class="label">PII and flags review rules</text>
  <text x="350" y="598" class="note">Raw case stops here</text>

  <rect x="660" y="115" width="430" height="610" class="zone" fill="#f3edfa" stroke="#8063a8"/>
  <text x="680" y="150" class="heading">Governed execution — `workflow.py` / LangGraph</text>
  <rect x="690" y="185" width="165" height="105" class="box" fill="#ffffff"/>
  <text x="710" y="220" class="heading">Remote RAG</text>
  <text x="710" y="247" class="label">HTTP → port 8081</text>
  <text x="710" y="270" class="label">role filter in subgraph</text>
  <rect x="890" y="185" width="165" height="105" class="box" fill="#ffffff"/>
  <text x="910" y="220" class="heading">Risk score</text>
  <text x="910" y="247" class="label">typed local</text>
  <text x="910" y="270" class="label">development signal</text>
  <rect x="690" y="350" width="165" height="105" class="box" fill="#ffffff"/>
  <text x="710" y="385" class="heading">Proposal</text>
  <text x="710" y="412" class="label">JSON schema +</text>
  <text x="710" y="435" class="label">citation validation</text>
  <rect x="890" y="350" width="165" height="105" class="box" fill="#fff6e8"/>
  <text x="910" y="385" class="heading">Interrupt</text>
  <text x="910" y="412" class="label">persist state;</text>
  <text x="910" y="435" class="label">wait for human</text>
  <rect x="690" y="515" width="365" height="90" class="box" fill="#ffffff"/>
  <text x="710" y="550" class="heading">Approve → route; reject/escalate → close; then evaluate</text>
  <text x="710" y="577" class="label">Every completed review receives deterministic checks and metrics.</text>

  <rect x="1125" y="115" width="230" height="610" class="zone" fill="#fff5e8" stroke="#b67b39"/>
  <text x="1145" y="150" class="heading">Local dependencies</text>
  <rect x="1150" y="185" width="180" height="120" class="box" fill="#ffffff"/>
  <text x="1170" y="220" class="heading">Ollama</text>
  <text x="1170" y="247" class="label">`/api/embed`</text>
  <text x="1170" y="270" class="label">`/api/chat`</text>
  <rect x="1150" y="360" width="180" height="120" class="box" fill="#ffffff"/>
  <text x="1170" y="395" class="heading">SQLite audit</text>
  <text x="1170" y="422" class="label">hash-chained events</text>
  <text x="1170" y="445" class="label">and metrics</text>
  <rect x="1150" y="535" width="180" height="90" class="box" fill="#ffffff"/>
  <text x="1170" y="570" class="heading">Local route</text>
  <text x="1170" y="597" class="label">record only; no HTTP</text>

  <path d="M240 242 H330" class="arrow"/><path d="M462 290 V330" class="arrow"/><path d="M462 450 V490" class="arrow"/><path d="M595 558 H690" class="arrow"/>
  <path d="M855 237 H890" class="arrow"/><path d="M972 290 V350" class="arrow"/><path d="M890 402 H855" class="arrow"/><path d="M855 402 H890" class="arrow"/>
  <path d="M855 237 H1150" class="arrow"/><path d="M1055 560 H1150" class="arrow"/><path d="M1090 415 H1150" class="arrow"/>
  <path d="M240 468 H890" class="arrow"/>
  <text x="455" y="780" class="small">Control sequence: authenticate → sanitize → retrieve permitted evidence → model inputs → human review → record/close → evaluate + audit</text>
</svg>
