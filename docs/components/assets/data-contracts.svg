<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Data contract reduction and expansion</title>
  <desc id="desc">Diagram showing that a rich external case is reduced to a sanitized submission before internal processing, then becomes evidence, score, proposal, review, routing, and evaluation contracts.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34536a"/></marker><style>.t{font:700 23px Arial,sans-serif;fill:#11283b}.h{font:700 16px Arial,sans-serif;fill:#11283b}.l{font:14px Arial,sans-serif;fill:#22445b}.s{font:13px Arial,sans-serif;fill:#5d3d00}.b{stroke:#34536a;stroke-width:2;rx:12}.a{stroke:#34536a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1400" height="560" fill="#f8fbfd"/><text x="45" y="48" class="t">Typed contracts deliberately reduce data exposure before models and persistence</text>
  <rect x="55" y="105" width="260" height="315" class="b" fill="#e8f2fb"/><text x="80" y="145" class="h">`CaseSubmission`</text><text x="80" y="180" class="l">Case, tenant, actor, roles</text><text x="80" y="207" class="l">Action, product, narrative</text><text x="80" y="234" class="l">Exposure</text><text x="80" y="261" class="l">Optional email / phone /</text><text x="80" y="288" class="l">customer reference</text><text x="80" y="340" class="s">Allowed only at API edge</text>
  <path d="M315 260 H430" class="a"/><text x="335" y="238" class="l">Policy gate</text>
  <rect x="430" y="105" width="270" height="315" class="b" fill="#edf7ee"/><text x="455" y="145" class="h">`SanitizedSubmission`</text><text x="455" y="180" class="l">Only decision fields needed</text><text x="455" y="207" class="l">Redacted narrative markers</text><text x="455" y="234" class="l">PII redaction count + time</text><text x="455" y="282" class="s">No direct PII fields</text><text x="455" y="340" class="s">Permitted graph/model/audit input</text>
  <path d="M700 260 H815" class="a"/><text x="720" y="238" class="l">Typed workflow</text>
  <rect x="815" y="80" width="500" height="365" class="b" fill="#f3edfa"/><text x="840" y="120" class="h">Provenance and decision contracts</text>
  <rect x="850" y="150" width="190" height="95" class="b" fill="#ffffff"/><text x="870" y="185" class="h">Evidence</text><text x="870" y="212" class="l">chunk, version, scores</text>
  <rect x="1080" y="150" width="190" height="95" class="b" fill="#ffffff"/><text x="1100" y="185" class="h">Risk score</text><text x="1100" y="212" class="l">model + version + factors</text>
  <rect x="850" y="285" width="190" height="95" class="b" fill="#ffffff"/><text x="870" y="320" class="h">Proposal</text><text x="870" y="347" class="l">recommendation + citations</text>
  <rect x="1080" y="285" width="190" height="95" class="b" fill="#ffffff"/><text x="1100" y="320" class="h">Review / result</text><text x="1100" y="347" class="l">human outcome + evaluation</text>
  <path d="M1040 198 H1080" class="a"/><path d="M945 245 V285" class="a"/><path d="M1175 245 V285" class="a"/>
  <text x="55" y="500" class="l">Pydantic validates each model at HTTP, graph-state, and Ollama-response boundaries. JSON alone is not sufficient.</text>
</svg>
