<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Local governed decision system with distributed RAG subgraph</title>
  <desc id="description">Flow from client and API through sanitization, a remote RAG LangGraph subgraph, native Ollama scoring and proposal, LangGraph, and human approval to a local-only record; audit and metrics receive events throughout the lifecycle.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .zone { stroke-width: 2; stroke-dasharray: 8 6; rx: 18; }
      .box { stroke-width: 2; rx: 12; }
      .h { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .t { font: 14px Arial, sans-serif; fill: #334155; }
      .s { font: 12px Arial, sans-serif; fill: #475569; }
      .cap { font: 700 14px Arial, sans-serif; fill: #475569; letter-spacing: .7px; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="760"/>

  <rect class="zone" x="20" y="52" width="230" height="560" fill="#fff7ed" stroke="#fb923c"/>
  <text class="cap" x="38" y="82">UNTRUSTED INPUT</text>
  <rect class="box" x="55" y="135" width="160" height="84" fill="#ffedd5" stroke="#f97316"/>
  <text class="h" x="97" y="168">Client</text>
  <text class="t" x="77" y="193">case + credentials</text>
  <rect class="box" x="55" y="295" width="160" height="96" fill="#ffedd5" stroke="#f97316"/>
  <text class="h" x="81" y="329">Identity</text>
  <text class="t" x="73" y="352">local headers</text>
  <text class="t" x="78" y="373">or OIDC JWT</text>

  <rect class="zone" x="275" y="52" width="920" height="560" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="cap" x="295" y="82">GOVERNED CORE</text>

  <rect class="box" x="305" y="135" width="170" height="84" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="349" y="167">FastAPI</text>
  <text class="t" x="328" y="191">contract and errors</text>

  <rect class="box" x="515" y="135" width="195" height="84" fill="#dcfce7" stroke="#16a34a"/>
  <text class="h" x="541" y="165">Policy / PII gate</text>
  <text class="t" x="535" y="191">redacts and classifies</text>

  <rect class="box" x="755" y="115" width="200" height="124" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="h" x="805" y="148">LangGraph</text>
  <text class="t" x="781" y="172">durable state</text>
  <text class="t" x="785" y="194">decision + pause</text>
  <text class="s" x="801" y="216">thread_id</text>

  <rect class="box" x="995" y="115" width="165" height="124" fill="#fef3c7" stroke="#d97706"/>
  <text class="h" x="1022" y="148">Human</text>
  <text class="h" x="1023" y="170">review</text>
  <text class="t" x="1012" y="195">approve / reject</text>
  <text class="t" x="1021" y="216">/ escalate</text>

  <rect class="box" x="330" y="330" width="180" height="100" fill="#f5f3ff" stroke="#7c3aed"/>
  <text class="h" x="358" y="362">Remote RAG</text>
  <text class="t" x="347" y="386">HTTP to port 8081</text>
  <text class="t" x="345" y="408">sanitized query + roles</text>

  <rect class="box" x="560" y="330" width="180" height="100" fill="#f5f3ff" stroke="#7c3aed"/>
  <text class="h" x="595" y="362">ML scoring</text>
  <text class="t" x="586" y="386">score + factors</text>
  <text class="t" x="584" y="408">model + version</text>

  <rect class="box" x="790" y="330" width="180" height="100" fill="#f5f3ff" stroke="#7c3aed"/>
  <text class="h" x="833" y="362">LLM</text>
  <text class="t" x="807" y="386">typed proposal</text>
  <text class="t" x="808" y="408">validated citations</text>

  <rect class="box" x="445" y="478" width="290" height="84" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="491" y="510">LangGraph checkpoint</text>
  <text class="t" x="487" y="535">local memory or PostgreSQL</text>

  <rect class="zone" x="1220" y="52" width="360" height="560" fill="#fdf2f8" stroke="#ec4899"/>
  <text class="cap" x="1240" y="82">RAG SERVICE / OLLAMA / LOCAL-ONLY ACTION</text>
  <rect class="box" x="1250" y="130" width="135" height="84" fill="#fce7f3" stroke="#db2777"/>
  <text class="h" x="1265" y="163">RAG subgraph</text>
  <text class="t" x="1260" y="187">retrieve + /api/embed</text>
  <rect class="box" x="1415" y="130" width="135" height="84" fill="#fce7f3" stroke="#db2777"/>
  <text class="h" x="1445" y="163">Local index</text>
  <text class="t" x="1439" y="187">JSONL + roles</text>
  <rect class="box" x="1250" y="300" width="135" height="84" fill="#fce7f3" stroke="#db2777"/>
  <text class="h" x="1274" y="333">Ollama</text>
  <text class="t" x="1280" y="357">local estimate</text>
  <rect class="box" x="1415" y="300" width="135" height="84" fill="#fce7f3" stroke="#db2777"/>
  <text class="h" x="1452" y="333">Ollama chat</text>
  <text class="t" x="1432" y="357">JSON schema</text>
  <rect class="box" x="1325" y="462" width="150" height="88" fill="#fee2e2" stroke="#dc2626"/>
  <text class="h" x="1355" y="495">Local record</text>
  <text class="t" x="1348" y="520">approved only</text>

  <rect x="275" y="640" width="1305" height="94" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="h" x="318" y="680">Audit ledger</text>
  <text class="t" x="319" y="706">HMAC-chained events per thread</text>
  <rect class="box" x="860" y="660" width="215" height="48" fill="#cffafe" stroke="#0891b2"/>
  <text class="h" x="902" y="690">Evaluation + metrics</text>
  <text class="t" x="1104" y="688">groundedness · policy · pass rate</text>

  <path class="arrow" d="M215 177 H305"/>
  <path class="dashed" d="M135 295 V239 H390 V219"/>
  <path class="arrow" d="M475 177 H515"/>
  <path class="arrow" d="M710 177 H755"/>
  <path class="arrow" d="M955 177 H995"/>
  <path class="dashed" d="M1078 239 V270 H855 V239"/>
  <path class="arrow" d="M755 195 V280 H420 V330"/>
  <path class="arrow" d="M755 195 V285 H650 V330"/>
  <path class="arrow" d="M855 239 V330"/>
  <path class="dashed" d="M510 380 H560"/>
  <path class="dashed" d="M740 380 H790"/>
  <path class="dashed" d="M510 350 H1250 V214"/>
  <path class="dashed" d="M510 410 H1415 V214"/>
  <path class="dashed" d="M740 380 H1250"/>
  <path class="dashed" d="M970 380 H1415"/>
  <path class="arrow" d="M1160 177 H1205 V506 H1325"/>
  <path class="dashed" d="M855 239 V478 H590"/>
  <path class="dashed" d="M390 219 V640"/>
  <path class="dashed" d="M610 219 V640"/>
  <path class="dashed" d="M855 239 V640"/>
  <path class="dashed" d="M1078 239 V640"/>
  <path class="dashed" d="M1400 550 V640"/>
</svg>
