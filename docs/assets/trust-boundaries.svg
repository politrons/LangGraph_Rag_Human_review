<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="title description">
  <title id="title">Local trust boundaries, data, and human approval</title>
  <desc id="description">PII and identity flow from untrusted input into the sanitized core, local Ollama, HMAC audit, and a local-only approval record.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.zone{stroke-width:2;stroke-dasharray:8 6;rx:20}.box{stroke-width:2;rx:12}.h{font:700 18px Arial,sans-serif;fill:#0f172a}.t{font:14px Arial,sans-serif;fill:#334155}.s{font:12px Arial,sans-serif;fill:#475569}.label{font:700 13px Arial,sans-serif;fill:#475569}.cap{font:700 14px Arial,sans-serif;fill:#475569;letter-spacing:.8px}.arrow{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#a)}.deny{fill:none;stroke:#dc2626;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#r)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#dc2626"/></marker>
  </defs>
  <rect class="bg" width="1600" height="740"/>
  <rect class="zone" x="25" y="55" width="315" height="520" fill="#fff7ed" stroke="#fb923c"/>
  <text class="cap" x="47" y="88">OUTSIDE THE BOUNDARY</text>
  <rect class="box" x="65" y="135" width="235" height="106" fill="#ffedd5" stroke="#f97316"/>
  <text class="h" x="99" y="170">Original submission</text>
  <text class="t" x="90" y="195">narrative, email, phone</text>
  <text class="t" x="88" y="217">declared identity, PII</text>
  <rect class="box" x="65" y="350" width="235" height="94" fill="#ffedd5" stroke="#f97316"/>
  <text class="h" x="104" y="386">Identity</text>
  <text class="t" x="96" y="411">headers or OIDC JWT</text>

  <rect class="zone" x="385" y="55" width="735" height="520" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="cap" x="408" y="88">GOVERNED BOUNDARY</text>
  <rect class="box" x="425" y="135" width="210" height="106" fill="#dcfce7" stroke="#16a34a"/>
  <text class="h" x="459" y="170">Policy / PII gate</text>
  <text class="t" x="453" y="195">redaction + injection</text>
  <text class="t" x="442" y="217">review reasons</text>
  <rect class="box" x="705" y="135" width="185" height="106" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="731" y="170">Sanitized case</text>
  <text class="t" x="727" y="195">without PII fields</text>
  <text class="t" x="729" y="217">safe markers</text>
  <rect class="box" x="950" y="135" width="130" height="106" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="972" y="171">State</text>
  <text class="t" x="966" y="195">checkpoint</text>
  <text class="t" x="973" y="217">durable</text>
  <rect class="box" x="425" y="330" width="250" height="115" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="h" x="470" y="365">RAG / ML / LLM</text>
  <text class="t" x="447" y="390">roles, evidence, score</text>
  <text class="t" x="445" y="412">and validated proposal</text>
  <rect class="box" x="760" y="330" width="240" height="115" fill="#fef3c7" stroke="#d97706"/>
  <text class="h" x="802" y="365">Human reviewer</text>
  <text class="t" x="790" y="390">tenant and role verified</text>
  <text class="t" x="798" y="412">authenticated decision</text>

  <rect class="zone" x="1160" y="55" width="410" height="520" fill="#fdf2f8" stroke="#ec4899"/>
  <text class="cap" x="1182" y="88">LOCAL MODEL SERVICES</text>
  <rect class="box" x="1200" y="135" width="150" height="96" fill="#fce7f3" stroke="#db2777"/>
  <text class="h" x="1232" y="170">Local index</text><text class="t" x="1221" y="195">allowed role only</text>
  <rect class="box" x="1380" y="135" width="150" height="96" fill="#fce7f3" stroke="#db2777"/>
  <text class="h" x="1420" y="170">Ollama</text><text class="t" x="1401" y="195">sanitized data</text>
  <rect class="box" x="1285" y="350" width="160" height="95" fill="#fee2e2" stroke="#dc2626"/>
  <text class="h" x="1315" y="385">Local record</text><text class="t" x="1305" y="410">after approve only</text>

  <rect x="385" y="620" width="1185" height="82" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="h" x="430" y="655">Audit ledger HMAC</text>
  <text class="t" x="430" y="680">thread chain: event, previous hash, current hash · evaluation metrics without PII labels</text>

  <path class="arrow" d="M300 188 H425"/>
  <path class="arrow" d="M300 397 H365 V260 H530 V241"/>
  <text class="s" x="317" y="300">identity validates actor, tenant, and roles</text>
  <path class="arrow" d="M635 188 H705"/>
  <path class="arrow" d="M890 188 H950"/>
  <path class="arrow" d="M797 241 V285 H550 V330"/>
  <path class="arrow" d="M675 388 H760"/>
  <path class="arrow" d="M675 365 H1200"/>
  <path class="arrow" d="M675 420 H1380"/>
  <path class="arrow" d="M1000 388 H1285"/>
  <text class="label" x="1068" y="371">approve</text>
  <path class="deny" d="M183 241 V540 H1160"/>
  <text x="70" y="530" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Original PII does not cross this boundary</text>
  <path class="arrow" d="M530 241 V620"/>
  <path class="arrow" d="M880 241 V620"/>
  <path class="arrow" d="M1370 445 V620"/>
  <text class="s" x="1212" y="484">reject / escalate have no path to local record</text>
</svg>
